<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whole Bake Island - Recipe Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
      color: #333;
      background: #FFF8DC;
    }

    /* Header */
    header {
      background: #F4D03F;
      padding: 1.5rem 2rem;
      box-shadow: 5px 5px 0px #E8C547;
      border-bottom: 4px solid #2C1810;
    }

    nav {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo {
      width: 70px;
      height: 70px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      border: 4px solid #2C1810;
      box-shadow: 3px 3px 0px #8B4513;
      transform: rotate(-5deg);
    }

    .brand-name {
      font-size: 2rem;
      font-weight: bold;
      color: #2C1810;
      transform: rotate(-2deg);
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .nav-links a {
      color: #2C1810;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
      transition: all 0.3s;
      padding: 0.5rem 1rem;
      border-radius: 20px;
    }

    .nav-links a:hover {
      background: white;
      transform: scale(1.1);
    }

    /* Hero Section */
    .hero {
      background: linear-gradient(135deg, #FFEAA7 0%, #FFD93D 50%, #F4D03F 100%);
      padding: 3rem 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '🧁';
      position: absolute;
      font-size: 15rem;
      opacity: 0.1;
      top: -3rem;
      right: -3rem;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }

    .hero-content {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .hero h1 {
      font-size: 3.5rem;
      color: #2C1810;
      margin-bottom: 1rem;
      text-shadow: 4px 4px 0px rgba(255,255,255,0.5);
      transform: rotate(-2deg);
    }

    .hero p {
      font-size: 1.4rem;
      color: #5D4E37;
      font-weight: bold;
    }

    /* Calculator Section */
    .calculator-section {
      padding: 4rem 2rem;
      background: white;
    }

    .calculator-container {
      max-width: 900px;
      margin: 0 auto;
      background: #FFF8DC;
      border-radius: 30px;
      padding: 3rem;
      border: 5px solid #F4D03F;
      box-shadow: 10px 10px 0px #E8C547;
    }

    .calculator-container h2 {
      text-align: center;
      font-size: 3rem;
      color: #2C1810;
      margin-bottom: 2rem;
      transform: rotate(-1deg);
    }

    .form-group {
      margin-bottom: 2rem;
    }

    .form-group label {
      display: block;
      font-size: 1.3rem;
      color: #2C1810;
      margin-bottom: 0.8rem;
      font-weight: bold;
    }

    .pan-selection {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1rem;
    }

    .pan-option {
      background: white;
      border: 4px solid #F4D03F;
      border-radius: 15px;
      padding: 1.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
    }

    .pan-option:hover {
      transform: scale(1.05);
      box-shadow: 5px 5px 0px #E8C547;
    }

    .pan-option input[type="radio"] {
      position: absolute;
      opacity: 0;
    }

    .pan-option input[type="radio"]:checked + .pan-content {
      background: #F4D03F;
      border-radius: 10px;
    }

    .pan-content {
      padding: 0.5rem;
      transition: all 0.3s;
    }

    .pan-size {
      font-size: 1.8rem;
      font-weight: bold;
      color: #2C1810;
    }

    .pan-portions {
      font-size: 1rem;
      color: #5D4E37;
      margin-top: 0.3rem;
    }

    .quantity-input {
      display: flex;
      align-items: center;
      gap: 1rem;
      justify-content: center;
      margin-top: 1rem;
    }

    .quantity-input input {
      width: 80px;
      padding: 0.8rem;
      font-size: 1.2rem;
      text-align: center;
      border: 4px solid #F4D03F;
      border-radius: 15px;
      font-weight: bold;
    }

    .calculate-button {
      width: 100%;
      background: #FF6B6B;
      color: white;
      padding: 1.5rem;
      font-size: 1.5rem;
      border: 4px solid #2C1810;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 5px 5px 0px #2C1810;
      font-family: 'Comic Sans MS', sans-serif;
      font-weight: bold;
      text-transform: uppercase;
      margin-top: 2rem;
    }

    .calculate-button:hover:not(:disabled) {
      background: #FF8787;
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0px #2C1810;
    }

    .calculate-button:disabled {
      background: #ccc;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      font-size: 1.3rem;
      color: #5D4E37;
    }

    .loading::after {
      content: '...';
      animation: dots 1.5s infinite;
    }

    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }

    /* Results Section */
    .results {
      margin-top: 3rem;
      background: white;
      border-radius: 25px;
      padding: 2.5rem;
      border: 5px solid #4ECDC4;
      box-shadow: 8px 8px 0px rgba(78, 205, 196, 0.3);
      display: none;
    }

    .results.show {
      display: block;
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .results h3 {
      font-size: 2.5rem;
      color: #2C1810;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .results-content {
      font-size: 1.2rem;
      color: #2C1810;
      line-height: 2;
      white-space: pre-wrap;
    }

    .ingredient-item {
      background: #FFF8DC;
      padding: 1rem 1.5rem;
      margin: 0.8rem 0;
      border-radius: 15px;
      border: 3px solid #F4D03F;
      font-weight: bold;
    }

    .error {
      background: #FFE5E5;
      border: 4px solid #FF6B6B;
      padding: 1.5rem;
      border-radius: 20px;
      text-align: center;
      color: #C92A2A;
      font-weight: bold;
      margin-top: 2rem;
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 2rem;
      }

      .brand-name {
        font-size: 1.3rem;
      }

      .pan-selection {
        grid-template-columns: repeat(2, 1fr);
      }

      .calculator-container {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <nav>
      <div class="logo-section">
        <div class="logo">🧁</div>
        <div class="brand-name">Whole Bake Island</div>
      </div>
      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#calculator">Calculator</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero" id="home">
    <div class="hero-content">
      <h1>🎂 Magic Recipe Calculator! ✨</h1>
      <p>Let's figure out exactly what you need for your amazing cake!</p>
    </div>
  </section>

  <!-- Calculator Section -->
  <section class="calculator-section" id="calculator">
    <div class="calculator-container">
      <h2>🎉 Pick Your Pan Size! 🎉</h2>

      <form id="calculatorForm">
        <div class="form-group">
          <label>Choose your cake pan diameter:</label>
          <div class="pan-selection">
            <label class="pan-option">
              <input type="radio" name="panSize" value="10" required>
              <div class="pan-content">
                <div class="pan-size">10cm</div>
                <div class="pan-portions">6 portions</div>
              </div>
            </label>
            <label class="pan-option">
              <input type="radio" name="panSize" value="15" required>
              <div class="pan-content">
                <div class="pan-size">15cm</div>
                <div class="pan-portions">14 portions</div>
              </div>
            </label>
            <label class="pan-option">
              <input type="radio" name="panSize" value="20" required>
              <div class="pan-content">
                <div class="pan-size">20cm</div>
                <div class="pan-portions">26 portions</div>
              </div>
            </label>
            <label class="pan-option">
              <input type="radio" name="panSize" value="25" required>
              <div class="pan-content">
                <div class="pan-size">25cm</div>
                <div class="pan-portions">38 portions</div>
              </div>
            </label>
            <label class="pan-option">
              <input type="radio" name="panSize" value="30" required>
              <div class="pan-content">
                <div class="pan-size">30cm</div>
                <div class="pan-portions">56 portions</div>
              </div>
            </label>
            <label class="pan-option">
              <input type="radio" name="panSize" value="35" required>
              <div class="pan-content">
                <div class="pan-size">35cm</div>
                <div class="pan-portions">76 portions</div>
              </div>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label>How many pans of this size?</label>
          <div class="quantity-input">
            <span style="font-size: 1.5rem;">🧁</span>
            <input type="number" id="panQuantity" name="panQuantity" min="1" max="10" value="1" required>
            <span style="font-size: 1.5rem;">🧁</span>
          </div>
        </div>

        <button type="submit" class="calculate-button" id="calculateBtn">
          Calculate My Recipe! 🎂
        </button>
      </form>

      <div id="loadingSection" class="loading" style="display: none;">
        Our baker is calculating your perfect recipe
      </div>

      <div id="resultsSection" class="results">
        <h3>✨ Your Perfect Recipe! ✨</h3>
        <div id="resultsContent" class="results-content"></div>
      </div>

      <div id="errorSection" class="error" style="display: none;">
        <div id="errorMessage"></div>
      </div>
    </div>
  </section>

  <script>
    const form = document.getElementById('calculatorForm');
    const calculateBtn = document.getElementById('calculateBtn');
    const loadingSection = document.getElementById('loadingSection');
    const resultsSection = document.getElementById('resultsSection');
    const resultsContent = document.getElementById('resultsContent');
    const errorSection = document.getElementById('errorSection');
    const errorMessage = document.getElementById('errorMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Get form values
      const panSize = document.querySelector('input[name="panSize"]:checked').value;
      const panQuantity = document.getElementById('panQuantity').value;

      // Hide previous results/errors
      resultsSection.classList.remove('show');
      errorSection.style.display = 'none';

      // Show loading
      calculateBtn.disabled = true;
      loadingSection.style.display = 'block';

      try {
        // Call API
        const result = await calculateRecipe(panSize, panQuantity);

        // Hide loading
        loadingSection.style.display = 'none';
        calculateBtn.disabled = false;

        // Show results
        displayResults(result);

      } catch (error) {
        console.error('Error:', error);
        loadingSection.style.display = 'none';
        calculateBtn.disabled = false;
        showError(error.message || 'Oops! Something went wrong. Please try again! 🙈');
      }
    });

    async function calculateRecipe(panSize, panQuantity) {
      const response = await fetch("/api/calculate", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          panSize: panSize,
          panQuantity: panQuantity
        })
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.message || `API request failed with status ${response.status}`);
      }

      const data = await response.json();
      return data.result;
    }

    function displayResults(result) {
      // Parse the result and format it nicely
      const lines = result.split('\n');
      let formattedHTML = '';

      lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('**') && line.endsWith('**')) {
          // Bold headers
          const text = line.replace(/\*\*/g, '');
          if (text.includes(':')) {
            const [label, value] = text.split(':');
            formattedHTML += `<div style="margin: 1.5rem 0; font-size: 1.4rem;"><strong style="color: #FF6B6B;">${label}:</strong> ${value}</div>`;
          } else {
            formattedHTML += `<div style="margin: 1.5rem 0; font-size: 1.5rem; color: #FF6B6B; font-weight: bold;">${text}</div>`;
          }
        } else if (line.startsWith('- ')) {
          // Ingredient items
          const ingredient = line.substring(2);
          formattedHTML += `<div class="ingredient-item">🧁 ${ingredient}</div>`;
        } else if (line) {
          // Regular text
          formattedHTML += `<div style="margin: 0.8rem 0;">${line}</div>`;
        }
      });

      resultsContent.innerHTML = formattedHTML;
      resultsSection.classList.add('show');

      // Scroll to results
      resultsSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorSection.style.display = 'block';
      errorSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  </script>
</body>
</html>
